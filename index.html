<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鎵爜鍐欏ソ璇?路 鏋佽嚧鐢电珵</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Noto Sans SC',-apple-system,sans-serif;
    background:#050510;color:#e8e8ff;min-height:100vh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  /* Animated bg */
  .bg{position:fixed;inset:0;z-index:0;}
  .bg::before{
    content:'';position:absolute;inset:0;
    background:
      radial-gradient(ellipse 600px 400px at 20% 30%, rgba(123,47,255,.15), transparent),
      radial-gradient(ellipse 500px 350px at 80% 70%, rgba(0,245,255,.10), transparent),
      radial-gradient(ellipse 300px 300px at 50% 50%, rgba(255,45,120,.08), transparent);
  }
  .bg-grid{
    position:fixed;inset:0;background-image:
      linear-gradient(rgba(0,245,255,.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,245,255,.03) 1px,transparent 1px);
    background-size:50px 50px;z-index:0;
  }

  .card{
    position:relative;z-index:1;
    background:rgba(13,13,36,.85);backdrop-filter:blur(20px);
    border:1px solid rgba(0,245,255,.15);border-radius:28px;
    padding:48px 36px;text-align:center;max-width:440px;width:90%;
    box-shadow:0 24px 80px rgba(0,0,0,.5),0 0 60px rgba(123,47,255,.1);
  }
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(0,245,255,.08);border:1px solid rgba(0,245,255,.2);
    border-radius:50px;padding:5px 14px;margin-bottom:20px;
  }
  .badge-dot{width:7px;height:7px;border-radius:50%;background:#00f5ff;
    animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 6px #00f5ff}50%{opacity:.3}}
  .badge-text{font-size:11px;font-weight:700;letter-spacing:2px;color:#00f5ff}

  h1{font-size:26px;font-weight:900;margin-bottom:8px;
    background:linear-gradient(135deg,#fff,#00f5ff);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .sub{font-size:14px;color:#8888bb;margin-bottom:32px;line-height:1.5;}

  /* QR Container */
  .qr-box{
    background:#fff;border-radius:18px;padding:20px;display:inline-block;
    margin-bottom:24px;position:relative;box-shadow:0 8px 32px rgba(0,245,255,.15);
  }
  .qr-box img{width:240px;height:240px;display:block;border-radius:8px;}
  .qr-label{
    position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
    background:linear-gradient(135deg,#7b2fff,#00f5ff);color:#fff;
    font-size:11px;font-weight:700;padding:4px 16px;border-radius:50px;
    white-space:nowrap;
  }

  /* URL box */
  .url-box{
    background:rgba(0,245,255,.05);border:1px solid rgba(0,245,255,.12);
    border-radius:12px;padding:12px 16px;margin-bottom:20px;
  }
  .url-label{font-size:10px;color:#666;margin-bottom:4px;font-weight:700}
  .url-text{font-size:12px;color:#00f5ff;word-break:break-all;user-select:all;font-family:monospace;}

  /* Steps */
  .steps{display:flex;gap:12px;justify-content:center;margin-bottom:20px;}
  .step-item{text-align:center;flex:1;}
  .step-num{
    width:28px;height:28px;border-radius:50%;background:rgba(123,47,255,.15);
    border:1px solid rgba(123,47,255,.4);color:#b57fff;
    font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;
    margin:0 auto 6px;
  }
  .step-desc{font-size:10px;color:#8888bb;}

  /* Direct link */
  .direct-link{
    display:inline-block;background:linear-gradient(135deg,#7b2fff,#00f5ff);
    color:#fff;text-decoration:none;padding:12px 28px;border-radius:14px;
    font-size:14px;font-weight:900;transition:all .25s;letter-spacing:1px;
  }
  .direct-link:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,245,255,.3);}

  .footer{margin-top:24px;font-size:10px;color:#555;}

  /* Floating particles */
  .particle{position:fixed;border-radius:50%;pointer-events:none;z-index:0;animation:float 8s infinite ease-in-out;}
  @keyframes float{
    0%,100%{transform:translateY(0) scale(1);opacity:.3}
    50%{transform:translateY(-30px)scale(1.1);opacity:.6}
  }
</style>
</head>
<body>

<div class="bg"></div><div class="bg-grid"></div>

<!-- Particles -->
<div class="particle" style="width:4px;height:4px;background:#00f5ff;top:20%;left:10%;animation-delay:0s"></div>
<div class="particle" style="width:6px;height:6px;background:#7b2fff;top:60%;left:85%;animation-delay:2s"></div>
<div class="particle" style="width:3px;height:3px;background:#ff2d78;top:80%;left:20%;animation-delay:4s"></div>
<div class="particle" style="width:5px;height:5px;background:#00f5ff;top:30%;left:75%;animation-delay:1s"></div>
<div class="particle" style="width:4px;height:4px;background:#b57fff;top:70%;left:50%;animation-delay:3s"></div>

<div class="card">
  <div class="badge"><div class="badge-dot"></div><span class="badge-text">鏋佽嚧鐢电珵棣?/span></div>
  <h1>鎵爜鍐欏ソ璇?馃幃</h1>
  <p class="sub">鎵嬫満鎵弿浜岀淮鐮?br>涓€閿敓鎴愯瘎浠锋枃妗堬紝澶嶅埗绮樿创鍗冲畬鎴?/p>

  <div class="qr-box">
    <!-- QR Code will be auto-generated -->
    <img id="qrImg" alt="鎵爜杩涘叆濂借瘎鐢熸垚鍣?>
    <div class="qr-label">鎵嬫満寰俊 / 鏀粯瀹濇壂涓€鎵?/div>
  </div>

  <div class="steps">
    <div class="step-item"><div class="step-num">1</div><div class="step-desc">鎵爜杩涘叆</div></div>
    <div class="step-item"><div class="step-num">2</div><div class="step-desc">閫夋ā鏉?鍒锋柊</div></div>
    <div class="step-item"><div class="step-num">3</div><div class="step-desc">澶嶅埗绮樿创</div></div>
  </div>

  <div class="url-box">
    <div class="url-label">馃敆 閾炬帴鍦板潃锛堢偣鍑诲鍒讹級</div>
    <div class="url-text" id="urlText"></div>
  </div>

  <a class="direct-link" id="directLink" href="#">鐩存帴鎵撳紑 鈫?/a>

  <p class="footer">姣忔鍒锋柊璇勪环鍐呭閮戒笉鍚?路 鍛婂埆鍗冪瘒涓€寰?/p>
</div>

<script>
  // Auto-detect the review-generator URL based on current location
  const basePath = location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);
  const reviewUrl = location.origin + basePath + 'review-generator.html';

  document.getElementById('urlText').textContent = reviewUrl;
  document.getElementById('directLink').href = reviewUrl;

  // Generate QR code
  const qrApi = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=' + encodeURIComponent(reviewUrl);
  document.getElementById('qrImg').src = qrApi;
</script>
</body>
</html>
