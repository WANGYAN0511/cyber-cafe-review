<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>扫码写好评</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#0d1117;color:#c9d1d9;min-height:100vh;display:flex;
  align-items:center;justify-content:center
}
.wrap{text-align:center;padding:24px;max-width:380px}
.wrap h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,#58a6ff,#3fb950);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.wrap .sub{color:#6e7681;font-size:13px;margin-bottom:28px}
.qr{background:#161b22;border:1px solid #21262d;border-radius:16px;padding:24px;margin-bottom:22px}
.qr img{width:200px;height:200px;border-radius:8px}
.qr p{color:#6e7681;font-size:12px;margin-top:10px}
.go{
  display:block;width:100%;padding:15px;background:#238636;color:#fff;
  font-size:17px;font-weight:700;text-decoration:none;border-radius:12px;
  transition:.2s;text-align:center
}
.go:active{background:#196c2e}
.tip{color:#484f58;font-size:12px;margin-top:18px;line-height:1.7}
.foot{color:#30363d;font-size:11px;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎮 电竞好评生成器</h1>
  <p class="sub">扫码一键生成大众点评/美团好评文案</p>
  <div class="qr">
    <img id="q" src="" alt="QR">
    <p>↑ 手机扫码 或 点下方按钮</p>
  </div>
  <a class="go" href="review-generator.html">🚀 直接打开 →</a>
  <p class="tip">💡 选风格 → 换一条 → 复制 → 粘贴到点评App</p>
  <p class="foot">RTX 5070~5090D · AMD X3D · 卓威/ROG 高端屏</p>
</div>
<script>
(function(){
 var u=location.origin+location.pathname.replace(/[^/]*$/,'')+'review-generator.html';
 document.getElementById('q').src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(u);
})();
</script>
</body>
</html>
