<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>电竞好评生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#0d1117;color:#c9d1d9;min-height:100vh;
  overflow-x:hidden;
}
.wrap{max-width:440px;margin:0 auto;padding:20px 16px 60px}
.header{text-align:center;padding:24px 0 20px}
.header h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,#58a6ff,#3fb950);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .sub{color:#6e7681;font-size:13px;margin-top:6px}
.tabs{display:flex;gap:10px;margin-bottom:18px}
.tab{flex:1;text-align:center;padding:11px 4px;border-radius:10px;font-size:14px;font-weight:600;
  border:1px solid #21262d;background:#161b22;color:#8b949e;cursor:pointer;transition:.2s}
.tab.on{border-color:#238636;background:#0d2818;color:#3fb950}
.tab.blue.on{border-color:#0969da;background:#052a48;color:#58a6ff}
.output{
  background:#161b22;border:1px solid #21262d;border-radius:14px;
  padding:18px 16px;margin-bottom:18px;min-height:170px;position:relative
}
.output textarea{
  width:100%;min-height:140px;background:transparent;border:none;
  color:#e6edf3;font-size:15px;line-height:1.85;resize:none;outline:none;
  font-family:inherit;
}
.output textarea::placeholder{color:#484f58}
.badge{position:absolute;top:10px;right:12px;font-size:11px;color:#484f58}
.btns{display:flex;gap:12px;margin-bottom:18px}
.btn{flex:1;padding:14px 0;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}
.btn-gen{background:#161b22;color:#58a6ff;border:1px solid #0969da}
.btn-gen:active{background:#052a48}
.btn-copy{background:#238636;color:#fff}
.btn-copy:active{background:#196c2e}
.btn-copy.done{background:#bf8700;color:#fff}
.tip{text-align:center;color:#484f58;font-size:12px;line-height:1.7}
.foot{text-align:center;color:#30363d;font-size:11px;margin-top:24px}
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <h1>🎮 电竞好评生成器</h1>
    <p class="sub">高端配置 · 一键生成 · 随心复制</p>
  </div>

  <div class="tabs" id="styleTabs">
    <div class="tab on" data-s="rich">🌟 丰富版</div>
    <div class="tab blue" data-s="casual">😎 随意版</div>
    <div class="tab blue" data-s="short">⚡ 简短版</div>
  </div>

  <div class="output">
    <span class="badge" id="cnt">已生成 0 条</span>
    <textarea id="out" readonly placeholder="点击下方按钮生成好评文案..."></textarea>
  </div>

  <div class="btns">
    <button class="btn btn-gen" onclick="gen()">🔄 换一条</button>
    <button class="btn btn-copy" id="cpBtn" onclick="doCopy()">📋 一键复制</button>
  </div>

  <p class="tip">💡 选风格 → 点换一条 → 满意后点复制 → 粘贴到点评App</p>
  <p class="foot">RTX 5070~5090D · AMD X3D · 卓威/ROG 高端屏</p>
</div>

// ===== 交互逻辑 =====
var style = 'rich';

document.getElementById('styleTabs').onclick = function(e){
  var t = e.target;
  if(!t.dataset.s) return;
  style = t.dataset.s;
  var all = this.querySelectorAll('.tab');
  for(var i=0;i<all.length;i++) all[i].classList.remove('on');
  t.classList.add('on');
  gen();
};

function gen(){
  var pool = (style==='rich') ? RICH : (style==='casual') ? CASUAL : SHORT;
  var txt, i = 0;
  do {
    txt = pool[Math.random()*pool.length|0]();
    i++;
  } while(hist.indexOf(txt)>=0 && i<50);
  hist.push(txt);
  if(hist.length > MAX) hist.shift();
  document.getElementById('out').value = txt;
  cnt++;
  document.getElementById('cnt').textContent = '已生成 '+cnt+' 条';
}

function doCopy(){
  var v = document.getElementById('out').value;
  if(!v){ alert('请先生成一条好评'); return }
  if(navigator.clipboard) {
    navigator.clipboard.writeText(v).then(ok);
  } else {
    var ta = document.getElementById('out');
    ta.select();
    document.execCommand('copy');
    ok();
  }
  function ok(){
    var b = document.getElementById('cpBtn');
    b.textContent = '✅ 已复制';
    b.classList.add('done');
    setTimeout(function(){
      b.textContent = '📋 一键复制';
      b.classList.remove('done');
    }, 2000);
  }
}

gen();

</html>
