function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function pickN(arr, n) {
  const shuffled = [...arr].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, n);
}

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

let genTotal = 0;
const history = new Set();
let currentStyle = 'rich';

// ============================================================

function generateRich() {
  const parts = [];

  // 寮€澶?  parts.push(pick(DB.openers));

  // 闅忔満閫?2-3 涓‖浠剁淮搴﹁缁嗗睍寮€
  const hwPool = shuffle(['gpu', 'cpu', 'monitor', 'peripheral']);
  const hwCount = 2 + Math.floor(Math.random() * 2); // 2 or 3
  for (let i = 0; i < hwCount; i++) {
    parts.push(pick(DB[hwPool[i]]));
  }

  // 鐜 + 鏈嶅姟锛堣嚦灏戝悇涓€鍙ワ級
  parts.push(pick(DB.environment));
  if (Math.random() > 0.4) parts.push(pick(DB.service));

  // 娓告垙浣撻獙锛?0%姒傜巼锛?  if (Math.random() > 0.5) parts.push(pick(DB.gaming));

  // 缁撳熬
  parts.push(pick(DB.closers));

  return parts.join('\n\n');
}

function generateCasual() {
  const opener = pick(DB.casualOpeners);

  // 闅忔満缁勫悎 3-4 涓淮搴︼紝姣忔绠€鐭?  const dims = pickN(
    [
      () => `閰嶇疆鏂归潰锛?{pick(DB.gpu).slice(0, 60)}...`,
      () => `CPU 缁欏姏锛?{pick(DB.cpu).slice(0, 60)}...`,
      () => `灞忓箷鐖界炕锛?{pick(DB.monitor).slice(0, 60)}...`,
      () => `澶栬鑸掓湇锛?{pick(DB.peripheral).slice(0, 60)}...`,
      () => `鐜涓嶉敊锛?{pick(DB.environment).slice(0, 60)}...`,
      () => `鏈嶅姟鍒颁綅锛?{pick(DB.service).slice(0, 60)}...`,
      () => `娓告垙浣撻獙锛?{pick(DB.gaming).slice(0, 60)}...`,
    ],
    3 + Math.floor(Math.random() * 2)
  );

  const closer = pick(DB.closers);

  return opener + '\n' + dims.map(d => d()).join('\n') + '\n\n' + closer;
}

function generateShort() {
  return pick(DB.shortTemplates);
}

function generateReview() {
  let text;
  let attempts = 0;

  do {
    switch (currentStyle) {
      case 'rich': text = generateRich(); break;
      case 'casual': text = generateCasual(); break;
      case 'short': text = generateShort(); break;
    }
    attempts++;
  } while (history.has(text) && attempts < 20);

  history.add(text);
  if (history.size > 200) { // 闃叉鍐呭瓨鑶ㄨ儉
    const arr = Array.from(history);
    history.clear();
    arr.slice(-100).forEach(h => history.add(h));
  }

  genTotal++;

  // Render with animation
  const el = document.getElementById('reviewText');
  el.style.opacity = '0';
  el.style.transform = 'translateY(10px)';

  setTimeout(() => {
    el.textContent = text;
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '1';
    el.style.transform = 'translateY(0)';
  }, 150);

  document.getElementById('genCount').innerHTML = `宸茬敓鎴?<span>${genTotal}</span> 鏉′笉閲嶅璇勪环`;

  // Scan effect
  const card = document.getElementById('reviewCard');
  card.classList.remove('scanning');
  void card.offsetWidth;
  card.classList.add('scanning');

  // Reset copy button
  const btn = document.getElementById('copyBtn');
  btn.classList.remove('copied');
  document.querySelector('#copyBtn span').textContent = '涓€閿鍒?;
}

function copyReview() {
  const text = document.getElementById('reviewText').textContent;
  const btn = document.getElementById('copyBtn');
  const btnText = document.querySelector('#copyBtn span');

  // Scan animation
  const card = document.getElementById('reviewCard');
  card.classList.remove('scanning');
  void card.offsetWidth;
  card.classList.add('scanning');

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showCopied()).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showCopied(); } catch(e) { showToast('澶嶅埗澶辫触锛岃闀挎寜鏂囧瓧鎵嬪姩澶嶅埗'); }
  document.body.removeChild(ta);
}

function showCopied() {
  const btn = document.getElementById('copyBtn');
  const btnText = document.querySelector('#copyBtn span');
  btn.classList.add('copied');
  btnText.textContent = '鉁?宸插鍒讹紒鍘荤矘璐村惂';

  showToast('澶嶅埗鎴愬姛锛佸幓绮樿创鍚?鉁?);
  setTimeout(() => { btn.classList.remove('copied'); btnText.textContent = '涓€閿鍒?; }, 2500);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentStyle = tab.dataset.style;
    generateReview();
  });
});

document.querySelectorAll('.platform-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// ============================================================
// Init
// ============================================================
generateReview();
</script>
</body>
</html>
